<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student System — Smart Academic ERP</title>
  <meta name="description" content="Real-time academic resource management and dynamic lecture reallocation platform">
  <link rel="stylesheet" href="/static/css/glassmorphism.css">
</head>
<body>
  <!-- Semantic App Mount Point -->
  <div id="app-root" role="region" aria-label="Student System Application">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
      <div class="glass-card" style="padding: 2rem; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #6366f1); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: white;">B</div>
        <h3 style="font-size: 1.125rem; font-weight: 700;">Initializing Student System...</h3>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Establishing secure session</p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Main ES Module Application -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
