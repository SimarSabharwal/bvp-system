<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BVP ERP System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='animations.css') }}">

    <script src="{{ url_for('static', filename='main.js') }}"></script>

</head>

<body>

<header class="topbar">

    <div class="logo">

        <img src="{{ url_for('static', filename='logo.png') }}"
             height="55">

        <h2>BVP ERP System</h2>

    </div>

    {% if session.get("role") %}

    <div>

        <a class="logout-btn"
           href="/logout">

            Logout

        </a>

    </div>

    {% endif %}

</header>


<div class="container fadeIn">

{% block content %}

{% endblock %}

</div>


<footer>

    © 2026 Bharati Vidyapeeth Institute of Management & Research

</footer>

</body>

</html>
